<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leonelas Ice Cream Business Card</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card-wrapper">

    <div class="card" id="card" tabindex="0">

      <div class="side front">

        <h1 class="title">Leonelas Ice Cream</h1>

        <img src="icecream.jpg" alt="Ice Cream Business" class="profile">

        <h2>Gerardo Lopez Cruz</h2>

        <a href="mailto:gerardolc17@gmail.com" class="btn">
          Email Us
        </a>
        
        <p class="instruction">Click the card to flip</p>

      </div>

      <div class="side back">

        <h2>About Us</h2>

        <p class="bio">
          Leonelas Ice Cream has served the city of West Whittier
          for over 15 years. We enjoy bringing ice cream and good
          service to our community.
        </p>

        <p>Email: gerardolc17@gmail.com</p>
        <p>Phone: 323-884-8449</p>

        <button class="btn" id="contactBtn">
          Contact Us
        </button>

      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
